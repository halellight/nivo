<header class="hd">
    <div class="wrap">
        <!-- Logo -->
        <div class="brand">
            <img src="/vire.png" alt="nivo" class="logo">
        </div>

        <!-- Browser favicon -->
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon.ico">
        <link rel="icon" type="image/png" sizes="16x16" href="/favicon.ico">
        <link rel="apple-touch-icon" href="/favicon.ico">

        <!-- Social sharing -->
        <meta property="og:image" content="/public/og.png">
        <meta name="twitter:image" content="/public/og.png">
        <meta property="og:image" content="/public/og.png" />
        <meta name="twitter:image" content="/public/og.png" />

        <!-- Open Graph: Facebook, WhatsApp, LinkedIn -->
        <meta property="og:type" content="website" />
        <meta property="og:title" content="nivo | For Nigerian Voters" />
        <meta property="og:description" content="The data platform for Nigerian voters." />
        <meta property="og:image" content="/public/og.png" />
        <meta property="og:image:alt" content="nivo - The data platform for Nigerian voters" />

        <!-- Twitter / X Card -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="nivo | For Nigerian Voters" />
        <meta name="twitter:description" content="The data platform for Nigerian voters." />
        <meta name="twitter:image" content="https://nivo.brimble.app/og.png" />
        <!-- Navigation and controls -->
        <div class="bar">
            <nav class="tabs" id="tabs" aria-label="Views"></nav>

            <label class="navm sm" id="navm"></label>

            <select class="sel" id="year" aria-label="Election year"></select>
        </div>
    </div>
</header>

<main id="v"></main>
